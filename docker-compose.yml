services:
  db:
    image: mysql:8.0
    container_name: pemex_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-pemex_db}
      MYSQL_USER: ${DB_USER:-pemex_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-pemex_password}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: pemex_gotenberg
    restart: always
    command:
      - "gotenberg"
      - "--api-timeout=300s"
    ports:
      - "3001:3000"

  api:
    build: ./backend
    container_name: pemex_backend
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    environment:
      - FLASK_ENV=production
      - DB_HOST=db
      - DB_USER=${DB_USER:-pemex_user}
      - DB_PASSWORD=${DB_PASSWORD:-pemex_password}
      - DB_NAME=${DB_NAME:-pemex_db}
      - GOTENBERG_URL=http://gotenberg:3000
    depends_on:
      - db
      - gotenberg

  interfaz:
    build: ./frontend
    container_name: pemex_frontend
    restart: always
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://localhost:5000
    depends_on:
      - api

volumes:
  db_data:
